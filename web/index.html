<!doctype html>
<html lang="zh">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>DGA · 数据治理 Agent</title>
<style>
  :root{--bg:#0f1117;--panel:#171a23;--panel2:#1d2130;--line:#2a2f3d;--text:#e6e8ee;--dim:#8b93a7;--accent:#4c8dff;--ok:#3ecf8e;--err:#ff6b6b;--warn:#f5b14c}
  *{box-sizing:border-box;margin:0;padding:0}
  body{font:14px/1.65 system-ui,"Segoe UI","Microsoft YaHei",sans-serif;background:var(--bg);color:var(--text);height:100vh;display:flex;flex-direction:column;overflow:hidden}
  header{display:flex;align-items:center;gap:12px;padding:10px 18px;border-bottom:1px solid var(--line);background:var(--panel)}
  .logo{font-weight:700;font-size:16px}.logo span{color:var(--accent)}
  .tag{font-size:11px;color:var(--dim);border:1px solid var(--line);border-radius:20px;padding:2px 10px}
  .tag b{color:var(--warn);font-weight:600}
  .wrap{flex:1;display:flex;min-height:0}
  aside{width:248px;border-right:1px solid var(--line);background:var(--panel);overflow-y:auto;padding:14px}
  aside h4{font-size:11px;color:var(--dim);letter-spacing:1px;margin:14px 0 6px}
  aside h4:first-child{margin-top:0}
  .tbl{display:flex;justify-content:space-between;padding:4px 8px;border-radius:6px;cursor:pointer;font-size:13px}
  .tbl:hover{background:var(--panel2)}
  .tbl .n{color:var(--dim);font-size:12px}
  .kv{font-size:12px;color:var(--dim);padding:2px 8px}
  .kv b{color:var(--text)}
  main{flex:1;display:flex;flex-direction:column;min-width:0}
  #chat{flex:1;overflow-y:auto;padding:26px 10px}
  .msg{max-width:780px;margin:0 auto 16px;padding:12px 16px;border-radius:12px;white-space:pre-wrap;word-break:break-word;font-size:14.5px}
  .msg.user{background:#24304a;margin-left:16%;border-radius:12px 12px 4px 12px}
  .msg.agent{background:var(--panel);border:1px solid var(--line);margin-right:2%;border-radius:12px 12px 12px 4px}
  .msg pre{background:#0b0d12;border:1px solid var(--line);border-radius:8px;padding:10px 12px;margin:8px 0;overflow-x:auto;font:12.5px/1.5 Consolas,monospace;color:#9fd0ff}
  .msg b{color:#fff}
  .tool{max-width:780px;margin:0 auto 8px;font-size:12px;color:var(--dim)}
  .tool .dot{display:inline-block;width:7px;height:7px;border-radius:50%;background:var(--warn);margin-right:6px;animation:pulse 1s infinite}
  .tool.done .dot{background:var(--ok);animation:none}
  @keyframes pulse{50%{opacity:.3}}
  .plan{border:1px solid var(--accent)!important;background:linear-gradient(180deg,#16203a,var(--panel))!important}
  .plan .pt{color:var(--accent);font-weight:700;margin-bottom:6px}
  .plan button{margin:10px 8px 0 0;padding:6px 18px;border-radius:8px;border:1px solid var(--accent);background:transparent;color:var(--accent);cursor:pointer;font-size:13px}
  .plan button.primary{background:var(--accent);color:#fff}
  .chips{max-width:780px;margin:0 auto;display:flex;flex-wrap:wrap;gap:8px;padding:0 0 10px}
  .chip{font-size:12px;color:var(--dim);border:1px solid var(--line);border-radius:20px;padding:4px 12px;cursor:pointer;background:var(--panel)}
  .chip:hover{color:var(--text);border-color:var(--accent)}
  footer{border-top:1px solid var(--line);padding:14px 18px;background:var(--panel)}
  .inrow{max-width:780px;margin:0 auto;display:flex;gap:10px}
  #inp{flex:1;background:var(--panel2);border:1px solid var(--line);border-radius:10px;padding:12px 14px;color:var(--text);font-size:14.5px;outline:none;resize:none}
  #inp:focus{border-color:var(--accent)}
  #send{background:var(--accent);border:0;border-radius:10px;padding:0 22px;color:#fff;cursor:pointer;font-size:14px}
  #send:disabled{opacity:.4}
  .cursor{display:inline-block;width:8px;height:15px;background:var(--accent);animation:pulse .8s infinite;vertical-align:-2px;margin-left:2px}
</style>
</head>
<body>
<header>
  <div class="logo">🤖 DGA<span> · Data Governance Agent</span></div>
  <div class="tag">对话式数据接入 / 治理 / 报送</div>
  <div class="tag">v0.1 <b>规则路由模式</b> · LLM 编排 W12 接入</div>
  <div class="tag" style="margin-left:auto">Apache 工具：Flink · Kafka · HDFS · ZooKeeper · Flume <b>(demo)</b></div>
</header>
<div class="wrap">
  <aside>
    <h4>📦 数据源</h4>
    <div class="kv"><b>bank_retail</b> · duckdb</div>
    <h4>TABLES</h4><div id="tables"></div>
    <h4>🧵 KAFKA TOPICS</h4><div id="topics"></div>
    <h4>⚡ FLINK JOBS</h4><div id="jobs"></div>
    <h4>📊 治理台账</h4><div id="stats"></div>
  </aside>
  <main>
    <div id="chat">
      <div class="msg agent">👋 我是 <b>DGA</b>。所有数据治理操作都可以在对话里完成——不写 SQL、不配界面。
点下方快捷指令，或直接说「<b>帮助</b>」看全部能力。</div>
    </div>
    <div class="chips" id="chips"></div>
    <footer>
      <div class="inrow">
        <textarea id="inp" rows="1" placeholder="例如：检查 ods_customer_src 落标情况…""></textarea>
        <button id="send">发送</button>
      </div>
    </footer>
  </main>
</div>
<script>
const $=id=>document.getElementById(id);
const chat=$('chat'),inp=$('inp'),send=$('send');
const QUICK=['帮助','看看库里有什么表','检查 ods_customer_src 落标','跑一下质量规则','日活跃客户数的口径','ods_customer_src 血缘','检查报送映射','列一下 Kafka topic','提交 Flink SQL 作业','看看 ZooKeeper /dga'];
QUICK.forEach(q=>{const c=document.createElement('div');c.className='chip';c.textContent=q;c.onclick=()=>{inp.value=q;doSend()};$('chips').appendChild(c)});

function esc(s){return s.replace(/&/g,'&amp;').replace(/</g,'&lt;')}
function md(s){
  s=esc(s);
  s=s.replace(/```(\w*)\n?([\s\S]*?)```/g,(m,l,c)=>'<pre>'+c.replace(/\n$/,'')+'</pre>');
  s=s.replace(/\*\*(.+?)\*\*/g,'<b>$1</b>');
  return s.split('\n\n').map(p=>/^<pre>/.test(p)?p:'<div>'+p.replace(/\n/g,'<br>')+'</div>').join('');
}
let busy=false;
function add(cls,html){const d=document.createElement('div');d.className='msg '+cls;d.innerHTML=html;chat.appendChild(d);chat.scrollTop=chat.scrollHeight;return d}

async function doSend(text){
  if(busy)return; const msg=(text||inp.value).trim(); if(!msg)return;
  busy=true;send.disabled=true;inp.value='';
  add('user',esc(msg));
  let cur=null,toolRow=null;
  const resp=await fetch('/chat',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({session:'web',message:msg})});
  const reader=resp.body.getReader(),dec=new TextDecoder();let buf='';
  while(true){
    const{done,value}=await reader.read();if(done)break;
    buf+=dec.decode(value,{stream:true});
    let idx;
    while((idx=buf.indexOf('\n\n'))>=0){
      const part=buf.slice(0,idx);buf=buf.slice(idx+2);
      const el=part.split('\n').find(l=>l.startsWith('event: '));
      const dl=part.split('\n').find(l=>l.startsWith('data: '));
      if(!el||!dl)continue;
      const ev=el.slice(7); let data; try{data=JSON.parse(dl.slice(6))}catch(e){continue}
      if(ev==='tool_call'){
        toolRow=document.createElement('div');toolRow.className='tool';
        toolRow.innerHTML=`<span class="dot"></span>🔧 ${data.tool}`;chat.appendChild(toolRow);chat.scrollTop=chat.scrollHeight;
      }else if(ev==='token'){
        if(toolRow){toolRow.classList.add('done');toolRow=null}
        if(!cur){cur=add('agent','<span id="tw"></span><span class="cursor"></span>')}
        $('tw').innerHTML+=md(data.text);
        chat.scrollTop=chat.scrollHeight;
      }else if(ev==='plan_card'){
        const p=add('agent plan',`<div class="pt">🔐 变更计划卡 #${data.plan_id}</div>`
          +data.actions.map(a=>`<div>▶ 动作：${a.action||a.title||''}</div><div>▶ 影响：${a.impact||''}</div><div>▶ 回滚：${a.rollback||''}</div>`).join('<hr style="border-color:var(--line);margin:6px 0">')
          +`<button class="primary" onclick="doSend('确认')">✅ 确认执行</button><button onclick="doSend('取消')">❌ 取消</button>`);
      }else if(ev==='receipt'){
        if(cur)cur.querySelector('.cursor')?.remove();
      }
    }
  }
  if(cur)cur.querySelector('.cursor')?.remove();
  busy=false;send.disabled=false;loadSidebar();
}
async function loadSidebar(){
  try{const d=await(await fetch('/api/sidebar')).json();
    $('tables').innerHTML=d.tables.map(t=>`<div class="tbl" onclick="doSend('看看 ${t.table}')"><span>${t.table}</span><span class="n">${t.rows}</span></div>`).join('');
    $('topics').innerHTML=d.kafka_topics.map(t=>`<div class="kv">${t.topic} <b>${t.messages}</b></div>`).join('');
    $('jobs').innerHTML=d.flink_jobs.length?d.flink_jobs.map(j=>`<div class="kv">#${j.id} ${j.name} <b>${j.status.includes('RUNNING')?'🟢':'⚪'}</b></div>`).join(''):'<div class="kv">暂无作业</div>';
    $('stats').innerHTML=`<div class="kv">数据标准 <b>${d.stats.standards}</b> 条 · 指标 <b>${d.stats.metrics}</b> 个</div><div class="kv">审计日志 <b>${d.stats.audit}</b> 条（append-only）</div>`;
  }catch(e){}
}
$('send').onclick=()=>doSend();
inp.addEventListener('keydown',e=>{if(e.key==='Enter'&&!e.shiftKey){e.preventDefault();doSend()}});
loadSidebar();
</script>
</body>
</html>
