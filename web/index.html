<!doctype html>
<html lang="zh">
<head>
<meta charset="utf-8">
<title>DGA · Data Governance Agent</title>
<style>
  :root { --bg:#0f1117; --panel:#171a23; --line:#2a2f3d; --text:#e6e8ee; --dim:#8b93a7; --accent:#4c8dff; }
  * { box-sizing:border-box; margin:0; }
  body { font:14px/1.6 system-ui,"Segoe UI",sans-serif; background:var(--bg); color:var(--text); height:100vh; display:flex; flex-direction:column; }
  header { padding:10px 16px; border-bottom:1px solid var(--line); display:flex; gap:12px; align-items:center; }
  header .logo { font-weight:700; color:var(--accent); }
  aside { float:left; width:220px; border-right:1px solid var(--line); padding:12px; overflow:auto; }
  main { flex:1; display:flex; }
  #chat { flex:1; overflow:auto; padding:20px 24px; }
  .msg { max-width:820px; margin:0 auto 14px; padding:10px 14px; border-radius:10px; white-space:pre-wrap; }
  .user { background:#24304a; margin-left:20%; }
  .agent { background:var(--panel); border:1px solid var(--line); margin-right:4%; }
  .plan { border-color:var(--accent); }
  .plan button { margin:6px 8px 0 0; padding:4px 14px; border-radius:6px; border:1px solid var(--accent); background:transparent; color:var(--accent); cursor:pointer; }
  footer { border-top:1px solid var(--line); padding:12px 16px; display:flex; gap:10px; }
  #inp { flex:1; background:var(--panel); border:1px solid var(--line); border-radius:8px; padding:10px 12px; color:var(--text); }
  #send { background:var(--accent); border:0; border-radius:8px; padding:0 20px; color:#fff; cursor:pointer; }
</style>
</head>
<body>
<header><span class="logo">🤖 DGA</span><span style="color:var(--dim)">Data Governance Agent · v0.1</span></header>
<main>
  <aside style="color:var(--dim)">
    <b style="color:var(--text)">数据源</b>
    <div id="ds">bank_retail (duckdb)</div>
    <p style="margin-top:14px"><b style="color:var(--text)">审计</b></p>
    <div style="font-size:12px">append-only · /audit</div>
  </aside>
  <div id="chat">
    <div class="msg agent">👋 我是 DGA。可以试试：<br>· 连一下 demo 库，看看有什么表<br>· 检查 ods_customer_src 的落标情况<br>· 日活跃客户数的口径是什么</div>
  </div>
</main>
<footer>
  <input id="inp" placeholder="输入消息…（对话编排 W12 接入，当前为骨架通路）" />
  <button id="send">发送</button>
</footer>
<script>
const chat = document.getElementById('chat'), inp = document.getElementById('inp');
function add(cls, text, isPlan) {
  const d = document.createElement('div'); d.className = 'msg ' + cls + (isPlan ? ' plan' : '');
  d.textContent = text;
  if (isPlan) {
    const ok = document.createElement('button'); ok.textContent = '✅ 确认';
    const no = document.createElement('button'); no.textContent = '❌ 取消';
    ok.onclick = () => { fetch('/plan/' + isPlan + '/confirm', {method:'POST'}); d.innerHTML += '<br>[已确认]'; };
    no.onclick = () => { d.innerHTML += '<br>[已取消]'; };
    d.append(document.createElement('br'), ok, no);
  }
  chat.appendChild(d); chat.scrollTop = chat.scrollHeight; return d;
}
async function send() {
  const text = inp.value.trim(); if (!text) return;
  add('user', text); inp.value = '';
  const es = new EventSource('/chat?x=1'); es.close(); // 占位：改为 fetch+ReadableStream
  const resp = await fetch('/chat', {method:'POST', headers:{'Content-Type':'application/json'},
    body: JSON.stringify({session:'web', message:text})});
  const reader = resp.body.getReader(), dec = new TextDecoder(); let cur = null;
  while (true) {
    const {done, value} = await reader.read(); if (done) break;
    for (const part of dec.decode(value, {stream:true}).split('\n\n')) {
      const line = part.split('\n').find(l => l.startsWith('data: '));
      if (!line) continue;
      try { const ev = JSON.parse(line.slice(6));
        if (!cur) cur = add('agent', '');
        cur.textContent += ev.text || '';
      } catch(e) {}
    }
  }
}
document.getElementById('send').onclick = send;
inp.addEventListener('keydown', e => { if (e.key === 'Enter') send(); });
</script>
</body>
</html>
